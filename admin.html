<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post to "Stuff Nadia's Doing"</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/layout.css">
</head>
<body>
    <div id="editor">
      <p>View: <a href="/index.html">Posts</a></p>
    <h3>Draft post</h3>
    <form id="blogForm" method="post">
      <label for="title">Title</label><br>
    <input type="text" id="title" placeholder="Post Title" required><br><br>
    <label for="content">Body</label><br>
    <textarea id="content" placeholder="Content..." rows="10" cols="50" required></textarea><br><br>
    <label for="imageFile">Upload image</label><br>
    <input type="file" id="imageFile" label="Upload image" accept="image/*"><br><br>
    <button type="submit">Publish</button>
    </form>
  </div>
  </div>
  <script>
    document.getElementById('blogForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const imageInput = document.getElementById('imageFile');
      let imageUrl = "";
      // 1. Upload Image if one is selected
      if (imageInput.files.length > 0) {
        const imgData = new FormData();
        imgData.append('file', imageInput.files[0]);
        const uploadReq = await fetch('/api/admin/upload', {
          method: 'POST',
          body: imgData,
          credentials: 'include'
        });
        console.log(uploadReq);
        if (uploadReq.ok){
        const uploadRes = await uploadReq.json();
        imageUrl = uploadRes.url;
        }
      }

      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('content', document.getElementById('content').value);
      formData.append('image_url', imageUrl); //
      console.log(document.getElementById('title'));
      console.log(document.getElementById('content'));
      console.log(imageUrl);

      const response = await fetch('/api/admin/post', {
        method: 'POST',
        body: formData,
        credentials: 'include'
      });

      if (response.ok) {
        alert("Published!");
        document.getElementById('blogForm').reset();
        window.location.href = '/index.html?new-post-made';
      } else {
        alert("Error publishing post");
      }
    });
  </script>
  <script>
    window.addEventListener('load', async(e) => {
    const response = await fetch(`/api/posts?page=1`);
  const posts = await response.json();

  const container = document.getElementById('recent-posts');
  container.innerHTML = ''; // Clear previous posts
  if(posts.length === 0) {
    container.innerHTML = '<p>No more posts.</p>';
    return;
  }

  posts.forEach(post => {
    const article = document.createElement('article');
    article.innerHTML = `
  <p><a href="/post/${post.id}/edit">${post.title}</a></h3></p>
  <p>Published: ${new Date(post.created_at * 1000).toLocaleString('en-US', {timeZone: 'America/New_York'})}</p>`;
  container.appendChild(article);
  });
});
  </script>
</body>
</html>
